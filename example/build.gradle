plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// ---------------------------------------------------------------------------
// generateSecrets — writes secrets.xml and gigyaSdkConfiguration.json from
// environment variables at CI build time.
//
// Required env vars:
//   GIGYA_API_KEY          — Gigya / SAP CDC site API key
//   GIGYA_API_DOMAIN       — Gigya data center (e.g. us1.gigya.com)
//   FACEBOOK_APP_ID        — Facebook App ID
//   FACEBOOK_CLIENT_TOKEN  — Facebook Client Token
//
// Local development: copy secrets.xml.template → src/main/res/values/secrets.xml
//                    copy gigyaSdkConfiguration.json.template → src/main/assets/gigyaSdkConfiguration.json
// Both real files are gitignored and must never be committed.
// ---------------------------------------------------------------------------
tasks.register('generateSecrets') {
    doLast {
        def apiKey              = System.getenv('GIGYA_API_KEY')           ?: ''
        def apiDomain           = System.getenv('GIGYA_API_DOMAIN')        ?: ''
        def facebookAppId       = System.getenv('FACEBOOK_APP_ID')         ?: ''
        def facebookClientToken = System.getenv('FACEBOOK_CLIENT_TOKEN')   ?: ''

        // Only write files when env vars are present (i.e. running in CI).
        // Locally the files are created manually from the .template files.
        if (!apiKey) {
            println "generateSecrets: no GIGYA_API_KEY env var — skipping (expected for local builds)."
            return
        }

        def secretsDir = file("src/main/res/values")
        secretsDir.mkdirs()
        new File(secretsDir, "secrets.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="gigya_api_key">${apiKey}</string>
    <string name="gigya_api_domain">${apiDomain}</string>
    <string name="facebook_app_id">${facebookAppId}</string>
    <string name="facebook_client_token">${facebookClientToken}</string>
</resources>
"""

        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()
        new File(assetsDir, "gigyaSdkConfiguration.json").text = """{
  "apiKey": "${apiKey}",
  "apiDomain": "${apiDomain}",
  "webView": {
    "allowFileAccess": true,
    "javaScriptEnabled": true
  },
  "account": {
    "cacheTime": 2,
    "include": ["data", "profile", "emails", "missing-required-fields", "customIdentifiers"],
    "extraProfileFields": ["languages", "phones", "education"]
  },
  "sessionVerificationInterval": 0
}
"""
        println "generateSecrets: secrets.xml and gigyaSdkConfiguration.json written."
    }
}

// Run generateSecrets before every build so CI always has fresh secret files.
tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn generateSecrets
    }
}

android {
    namespace 'com.gigya.android.sample'
    compileSdk 34

    defaultConfig {
        applicationId "com.gigya.android.sample"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {

        debug {
            storeFile file("keystore/debug-key.keystore")
            storePassword 'android'
            keyAlias 'key0'
            keyPassword 'android'
        }

        release {
            storeFile file("keystore/debug-key.keystore")
            storePassword 'android'
            keyAlias 'key0'
            keyPassword 'android'
        }
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }

    buildTypes {

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    // Compose BOM — pins all compose-* versions consistently
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose core
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Lifecycle + Compose integration (collectAsStateWithLifecycle)
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Immutable collections (stable UiState lists)
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Core Android
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.0'

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.10.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.10.0"

    // JSON
    implementation 'com.google.code.gson:gson:2.8.9'

    // SDK modules
    implementation project(path: ':sdk-core')
    implementation project(path: ':sdk-biometric')
    implementation project(path: ':sdk-nss')
    implementation project(path: ':sdk-auth')
    implementation project(path: ':sdk-tfa')

    // NSS engine
    debugImplementation 'com.gigya.gigyaNativeScreensetsEngine:flutter_debug:1.9.9'
    releaseImplementation 'com.gigya.gigyaNativeScreensetsEngine:flutter_release:1.9.9'

    // FIDO passwordless authentication
    implementation 'com.google.android.gms:play-services-fido:18.1.0'

    // Credentials (Google Sign-In, passkeys)
    implementation "androidx.credentials:credentials:1.2.2"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"

    // Social providers
    implementation 'com.facebook.android:facebook-android-sdk:14.1.1'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.8.0'
    implementation 'com.linecorp.linesdk:linesdk:5.8.1'

    // Chrome Custom Tabs (SSO, web login)
    implementation 'androidx.browser:browser:1.3.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

